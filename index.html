<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dodoma Car Rental | Car hire in Dodoma, open 24 hours</title>
<meta name="description" content="Dodoma Car Rental, Capital City Mall, Dodoma. Range Rover, Mercedes, Land Cruiser V8, Prado, Alphard, Coaster and more. With driver or self-drive. Call or WhatsApp, open 24 hours.">
<meta name="theme-color" content="#06080c">
<meta property="og:title" content="Dodoma Car Rental">
<meta property="og:description" content="Rent a car in Dodoma today. With driver or self-drive. Open 24 hours.">
<meta property="og:image" content="img/range-sport-1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/range-sport-1.jpg">
<style>
:root{
  --bg:#06080c; --bg2:#0b1017; --card:#0f151e; --line:#1b2636; --line2:#27364b;
  --tx:#eaf0f8; --mut:#8e9bb0; --blue:#2f7dff; --blue2:#69a8ff; --wa:#25d366; --gold:#f5c542;
  --r:18px; --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
h1,h2,h3,.brand,.btn,.price,.chip{font-family:Sora,Inter,sans-serif}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit}
.wrap{width:min(var(--max),100% - 40px);margin-inline:auto}
section{padding:84px 0;position:relative}
.eyebrow{font:600 12px/1 Sora,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--blue2);display:inline-flex;align-items:center;gap:10px;margin-bottom:16px}
.eyebrow:before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--blue),transparent)}
h2{font-size:clamp(28px,4.2vw,44px);line-height:1.12;letter-spacing:-.02em;margin-bottom:14px}
.lead{color:var(--mut);max-width:560px}

#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--blue2));z-index:70}
#draft{background:#3a2a00;color:#ffd98a;font-size:13px;text-align:center;padding:7px 14px}

/* header */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(6,8,12,.72);border-bottom:1px solid transparent;transition:border-color .3s}
header.on{border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;font-size:15px;white-space:nowrap}
.brand img{height:50px;width:auto;flex:none}
.flogo{height:44px;width:auto;margin-bottom:10px}
.brand b{color:var(--blue2);font-weight:800}
.brand small{display:block;font:500 9px/1 Inter,sans-serif;letter-spacing:.34em;color:var(--mut);margin-top:3px}
.links{display:flex;gap:28px;font-size:14px;color:var(--mut)}
.links a{position:relative;padding:6px 0;transition:color .2s}
.links a:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--blue);transition:width .25s}
.links a:hover{color:var(--tx)} .links a:hover:after{width:100%}
.right{display:flex;align-items:center;gap:10px}
#lang{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:999px;padding:7px 12px;font:600 12px Sora,sans-serif;cursor:pointer;transition:.2s}
#lang:hover{color:var(--tx);border-color:var(--blue)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:999px;padding:14px 24px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .25s,background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.b-call{background:var(--blue);color:#fff;box-shadow:0 10px 34px -10px rgba(47,125,255,.8)}
.b-call:hover{background:#4a8eff;box-shadow:0 14px 44px -8px rgba(47,125,255,.95);transform:translateY(-2px)}
.b-wa{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.45);color:#7df0a8}
.b-wa:hover{background:var(--wa);color:#04210f;transform:translateY(-2px)}
.b-wa.solid{background:var(--wa);color:#04210f;border-color:var(--wa)}
.b-wa.solid:hover{background:#3be07a}
.b-ghost{border-color:var(--line2);color:var(--tx);background:none}
.b-ghost:hover{border-color:var(--blue);color:var(--blue2)}
.b-sm{padding:10px 16px;font-size:13px}

/* hero */
.hero{padding:48px 0 40px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-20% -10% auto;height:120%;background:radial-gradient(60% 50% at 76% 36%,rgba(47,125,255,.22),transparent 70%),radial-gradient(40% 40% at 8% 0%,rgba(47,125,255,.1),transparent 70%);pointer-events:none}
.hgrid{display:grid;grid-template-columns:1fr 1.08fr;gap:44px;align-items:center;position:relative}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);background:rgba(15,21,30,.7);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--mut);margin-bottom:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wa);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.7)}70%{box-shadow:0 0 0 9px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
h1{font-size:clamp(38px,6.2vw,68px);line-height:1.03;letter-spacing:-.035em;font-weight:800;margin-bottom:20px}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--blue2),#fff 65%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:18px;color:var(--mut);max-width:500px;margin-bottom:28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.stats{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.stat b{display:block;font:700 26px/1.1 Sora,sans-serif}
.stat span{font-size:13px;color:var(--mut)}

.show{position:relative}
.frame{position:relative;aspect-ratio:16/10;border-radius:26px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 50px 110px -50px rgba(47,125,255,.75),0 30px 60px -30px #000;background:#0a0f16;transform:perspective(1100px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1.1s ease,transform 6s ease-out}
.frame img.on{opacity:1;transform:scale(1)}
.frame:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(6,8,12,.86));pointer-events:none}
.cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cap b{font:700 19px/1.2 Sora,sans-serif;display:block}
.cap span{font-size:13px;color:#c9d6ea}
.cap .go{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:0;cursor:pointer;transition:transform .2s}
.cap .go:hover{transform:scale(1.08)} .cap .go svg{width:18px;height:18px}
.dots{position:absolute;top:16px;left:18px;z-index:2;display:flex;gap:6px}
.dots i{width:22px;height:3px;border-radius:3px;background:rgba(255,255,255,.3);transition:.4s}
.dots i.on{background:#fff;width:34px}
.float{position:absolute;z-index:3;background:rgba(11,16,23,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 20px 40px -20px #000;animation:bob 5s ease-in-out infinite}
.float b{font:700 14px Sora,sans-serif;display:block;line-height:1.2}
.float span{color:var(--mut);font-size:12px}
.float i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(47,125,255,.15);color:var(--blue2);font-style:normal}
.float i svg{width:17px;height:17px}
.f1{top:-16px;right:-10px} .f2{bottom:74px;left:-22px;animation-delay:-2.5s}
@keyframes bob{50%{transform:translateY(-8px)}}

/* booking */
.book{margin-top:46px;background:linear-gradient(180deg,rgba(15,21,30,.94),rgba(11,16,23,.94));border:1px solid var(--line);border-radius:22px;padding:18px;position:relative;box-shadow:0 30px 80px -40px #000}
.bgrid{display:grid;grid-template-columns:1.5fr 1fr .6fr 1fr 1fr;gap:12px}
.f label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 7px 4px}
.f select,.f input{width:100%;background:#0a0f16;border:1px solid var(--line2);color:var(--tx);border-radius:12px;padding:13px 12px;font:500 15px Inter,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;color-scheme:dark;min-width:0}
.f select:focus,.f input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.18)}
.est{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2);flex-wrap:wrap}
.est .sum small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.est .sum b{font:700 24px/1.2 Sora,sans-serif}
.est .sum span{display:block;font-size:13px;color:var(--mut)}

/* strip */
.strip{border-block:1px solid var(--line);background:var(--bg2);padding:0}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.fact{padding:26px 22px;display:flex;gap:14px;align-items:center;border-left:1px solid var(--line)}
.fact:first-child{border-left:0;padding-left:0}
.fact i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(47,125,255,.12);color:var(--blue2);flex:none}
.fact i svg{width:20px;height:20px}
.fact b{display:block;font:600 15px Sora,sans-serif}
.fact span{font-size:13px;color:var(--mut)}

/* occasions */
.occ{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px}
.oc{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:pointer;text-align:left;background:#0a0f16;padding:0}
.oc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .4s;filter:saturate(.85) brightness(.8)}
.oc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,12,.1) 30%,rgba(6,8,12,.92))}
.oc:hover img{transform:scale(1.09);filter:none}
.oc div{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.oc b{font:700 19px/1.2 Sora,sans-serif;display:block;margin-bottom:4px}
.oc span{font-size:13px;color:#c9d6ea;display:flex;align-items:center;gap:6px}
.oc span svg{width:14px;height:14px;transition:transform .3s} .oc:hover span svg{transform:translateX(5px)}

/* fleet */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:none;color:var(--mut);border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip sup{font-size:10px;opacity:.7;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.car-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .35s}
.car-card:hover{transform:translateY(-6px);border-color:rgba(47,125,255,.6);box-shadow:0 26px 60px -30px rgba(47,125,255,.55)}
.pic{aspect-ratio:4/3;background:#0a0f16;position:relative;overflow:hidden}
.pic .bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(22px) brightness(.55)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.pic.wide img{object-fit:contain}
.car-card:hover .pic img{transform:scale(1.06)}
.pic:after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(180deg,transparent,rgba(15,21,30,.9));pointer-events:none}
.tag{position:absolute;top:12px;left:12px;z-index:2;font:600 11px Sora,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:rgba(6,8,12,.75);border:1px solid var(--line2);padding:5px 10px;border-radius:999px;color:var(--blue2);backdrop-filter:blur(6px)}
.tag.vip{color:var(--gold);border-color:rgba(245,197,66,.4)}
.cnt{position:absolute;top:12px;right:12px;z-index:2;font-size:12px;background:rgba(6,8,12,.75);border-radius:999px;padding:4px 9px;display:flex;gap:5px;align-items:center;color:#c9d6ea}
.cnt svg{width:13px;height:13px}
.body{padding:18px}
.body h3{font-size:19px;line-height:1.25;margin-bottom:10px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.bd{font-size:12px;padding:4px 9px;border-radius:8px;background:rgba(47,125,255,.1);color:#b9d3ff}
.bd.g{background:rgba(37,211,102,.1);color:#8eedb3}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.price{font-weight:700;font-size:18px;line-height:1.2}
.price small{display:block;font:400 12px Inter,sans-serif;color:var(--mut);margin-top:2px}
.acts{display:flex;gap:8px}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);transition:.2s;background:none;cursor:pointer}
.ic svg{width:18px;height:18px}
.ic.c:hover{background:var(--blue);border-color:var(--blue)} .ic.w{color:#7df0a8;border-color:rgba(37,211,102,.4)} .ic.w:hover{background:var(--wa);color:#04210f}

/* marquee */
.areas{padding:0;border-block:1px solid var(--line);overflow:hidden;background:var(--bg2)}
.track{display:flex;gap:48px;white-space:nowrap;padding:22px 0;width:max-content;animation:mq 46s linear infinite;font:700 clamp(18px,2.6vw,26px) Sora,sans-serif;color:transparent;-webkit-text-stroke:1px #3b4c66;text-transform:uppercase;letter-spacing:.04em}
.track span{display:inline-flex;align-items:center;gap:48px}
.track span:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
@keyframes mq{to{transform:translateX(-50%)}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px;counter-reset:s}
.step{border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;background:linear-gradient(180deg,var(--card),transparent);position:relative;counter-increment:s;transition:border-color .3s}
.step:hover{border-color:var(--line2)}
.step:before{content:"0" counter(s);font:800 54px/1 Sora,sans-serif;color:transparent;-webkit-text-stroke:1px var(--line2);display:block;margin-bottom:18px;transition:.3s}
.step:hover:before{-webkit-text-stroke-color:var(--blue)}
.step h3{font-size:18px;margin-bottom:8px}
.step p{color:var(--mut);font-size:15px}

/* price notes */
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.note{border-left:2px solid var(--blue);padding:4px 0 4px 18px}
.note b{font:600 16px Sora,sans-serif;display:block;margin-bottom:4px}
.note span{color:var(--mut);font-size:15px}

/* contact */
.cgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:stretch}
.info{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px}
.li{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.li:last-of-type{border:0}
.li i{color:var(--blue2);flex:none;margin-top:3px} .li i svg{width:20px;height:20px}
.li b{display:block;font:600 15px Sora,sans-serif} .li span,.li a{color:var(--mut);font-size:15px}
.li a:hover{color:var(--tx)}
.map{border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:380px;background:#0a0f16}
.map iframe{width:100%;height:100%;min-height:380px;border:0;filter:invert(.92) hue-rotate(180deg) saturate(.7) brightness(.95)}

.final{text-align:center;padding:96px 0;overflow:hidden}
.final:before{content:"";position:absolute;left:50%;top:50%;width:min(900px,120%);aspect-ratio:2;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(47,125,255,.2),transparent 70%);pointer-events:none}
.final h2{font-size:clamp(30px,5vw,54px);max-width:760px;margin:0 auto 26px;position:relative}
.final .cta{justify-content:center;position:relative}
footer{border-top:1px solid var(--line);padding:26px 0 30px;color:var(--mut);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* sticky mobile bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:none;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(6,8,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar .btn{flex:1;padding:14px 10px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(3,5,8,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{width:min(940px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:24px;display:grid;grid-template-columns:1.1fr 1fr;transform:translateY(30px) scale(.97);transition:transform .4s cubic-bezier(.2,.8,.2,1);position:relative}
.modal.open .sheet{transform:none}
.x{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(6,8,12,.8);cursor:pointer;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.gal{padding:16px;display:flex;flex-direction:column;gap:10px}
.big{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#0a0f16}
.big .bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(24px) brightness(.5)}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px}
.thumbs button{width:74px;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#0a0f16;opacity:.6;transition:.2s}
.thumbs button.on{border-color:var(--blue);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.det{padding:30px 28px 26px 12px;display:flex;flex-direction:column}
.det h3{font-size:26px;line-height:1.15;margin:10px 44px 6px 0}
.det .tag{position:static;display:inline-block;align-self:flex-start}
.ptab{margin:18px 0 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pr{display:flex;justify-content:space-between;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:center}
.pr:last-child{border:0}
.pr div b{display:block;font:600 14px Sora,sans-serif}
.pr div span{font-size:12px;color:var(--mut)}
.pr strong{font:700 16px Sora,sans-serif;white-space:nowrap;text-align:right}
.pr strong.soft{font:500 13px Inter,sans-serif;color:var(--mut);white-space:normal;max-width:130px}
.det .cta{margin-top:auto}
.det .cta .btn{flex:1}

.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

@media (max-width:1020px){
  .hgrid{grid-template-columns:1fr;gap:34px}
  .show{order:-1;max-width:640px;margin:0 auto;width:100%}
  .f1{right:6px} .f2{left:6px}
  .bgrid{grid-template-columns:1fr 1fr}
  .bgrid .f:first-child{grid-column:1/-1}
  .grid{grid-template-columns:repeat(2,1fr)}
  .occ{grid-template-columns:repeat(2,1fr)} .oc{aspect-ratio:4/3}
  .cgrid{grid-template-columns:1fr}
  .links{display:none}
}
@media (max-width:720px){
  .sheet{grid-template-columns:1fr;border-radius:22px 22px 0 0;max-height:92dvh;align-self:end}
  .modal{padding:0;place-items:end center}
  .det{padding:6px 18px 22px}

  e2:{sw:"Jinsi ya kukodi", en:"How it works"}, h2b:{sw:"Hatua tatu, basi", en:"Three steps, that is all"},
  p1:{sw:"Chagua gari", en:"Choose a car"}, p1b:{sw:"Angalia magari, picha na bei, uchague linalofaa safari yako.", en:"Look through the cars, photos and prices, and pick the one that suits your trip."},
  p2:{sw:"Piga simu au WhatsApp", en:"Call or WhatsApp"}, p2b:{sw:"Tuambie tarehe na idadi ya siku. Tunakuthibitishia upatikanaji na bei.", en:"Tell us the date and number of days. We confirm availability and the price."},
  p3:{sw:"Anza safari", en:"Start your trip"}, p3b:{sw:"Ofisi yetu ipo Capital City Mall, Dodoma.", en:"Our office is at Capital City Mall, Dodoma."},
  e3:{sw:"Mawasiliano", en:"Contact"}, h2c:{sw:"Tupate hapa", en:"Find us here"},
  c1:{sw:"Simu", en:"Phone"}, c2:{sw:"Tuma ujumbe sasa", en:"Send a message now"}, c3:{sw:"Ofisi", en:"Office"},
  c4:{sw:"Saa za kazi", en:"Hours"}, c4b:{sw:"Wazi saa 24, Jumatatu hadi Jumapili", en:"Open 24 hours, Monday to Sunday"},
  dir:{sw:"Maelekezo ya ramani", en:"Get directions"},
  fin:{sw:"Unahitaji gari Dodoma? Tupigie sasa.", en:"Need a car in Dodoma? Call us now."},
  wabtn:{sw:"Tuma WhatsApp", en:"Send a WhatsApp"},
  foot:{sw:"Kodi gari Dodoma · Wazi saa 24", en:"Car rental in Dodoma · Open 24 hours"}
};

var lang = "en";   // English first; the button in the header switches to Kiswahili
try { lang = localStorage.getItem("dcr_lang2") || "en"; } catch (e) {}
var filter = "all";
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function t(k) { return (T[k] && T[k][lang]) || k; }
// every WhatsApp message from the site ends with this tag, so the owner can count website enquiries
function waLink(msg) { return "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg + (lang === "sw" ? " (Kupitia website)" : " (Via the website)")); }
function pretty(n) { return n.replace(/^\+(\d{3})(\d{3})(\d{3})(\d{3})$/, "+$1 $2 $3 $4"); }
function money(n) { return "TZS " + n.toLocaleString("en-US"); }
function src(n) { return "img/" + n + ".jpg"; }
function byId(id) { return CARS.filter(function (c) { return c.id === id; })[0]; }
function match(c, f) { return f === "all" || (f === "self" ? !!c.self : c.cat === f); }

var ICON = {
  call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

function carMsg(c) {
  return lang === "sw"
    ? "Habari, naomba kujua upatikanaji wa " + c.name + "."
    : "Hello, I would like to know the availability of the " + c.name + ".";
}
function badges(c) {
  var b = '<span class="bd">' + t("bdrv") + "</span>";
  if (c.self) b += '<span class="bd g">' + t("bself") + "</span>";
  if (c.out === null) b += '<span class="bd">' + t("btown") + "</span>";
  return b;
}

function renderChips() {
  var keys = ["all", "vip", "suv", "group", "self"];
  $("#chips").innerHTML = keys.map(function (k) {
    var n = CARS.filter(function (c) { return match(c, k); }).length;
    return '<button type="button" class="chip' + (k === filter ? " on" : "") + '" data-f="' + k + '">' + t(k) + "<sup>" + n + "</sup></button>";
  }).join("");
}
function renderCars() {
  var list = CARS.filter(function (c) { return match(c, filter); });
  $("#grid").innerHTML = list.map(function (c, i) {
    return '<article class="car-card rv" data-id="' + c.id + '" style="--d:' + (i % 3) * 0.08 + 's" tabindex="0">' +
      '<div class="pic' + (c.wide ? " wide" : "") + '">' + (c.wide ? '<div class="bg" style="background-image:url(' + src(c.img[0]) + ')"></div>' : "") +
      '<img src="' + src(c.img[0]) + '" alt="' + c.name + '" loading="lazy"><span class="tag ' + c.cat + '">' + t(c.cat) + '</span><span class="cnt">' + ICON.cam + c.img.length + "</span></div>" +
      '<div class="body"><h3>' + c.name + '</h3><div class="badges">' + badges(c) + "</div>" +
      '<div class="row"><div class="price">' + money(c.town) + "<small>" + t("perday") + "</small></div>" +
      '<div class="acts"><a class="ic c" href="tel:' + CALL + '" aria-label="' + t("call") + '">' + ICON.call + '</a><a class="ic w" target="_blank" rel="noopener" href="' + waLink(carMsg(c)) + '" aria-label="WhatsApp">' + ICON.wa + "</a></div></div></div></article>";
  }).join("");
  watch();
}
function renderSelect() {
  var keep = $("#bcar").value;
  $("#bcar").innerHTML = CARS.map(function (c) { return '<option value="' + c.id + '">' + c.name + "</option>"; }).join("");
  if (keep) $("#bcar").value = keep;
}
function renderTrack() {
  var one = CARS.map(function (c) { return "<span>" + c.name + "</span>"; }).join("");
  $("#track").innerHTML = one + one;
}

/* ---- estimate ---- */
function quote() {
  var c = byId($("#bcar").value), where = $("#bwhere").value, mode = $("#bdrv").value, days = Math.max(1, parseInt($("#bdays").value, 10) || 1);
  var selfOpt = $('#bdrv option[value="self"]'), outOpt = $('#bwhere option[value="out"]');
  selfOpt.disabled = !c.self; if (!c.self && mode === "self") { $("#bdrv").value = "drv"; mode = "drv"; }
  outOpt.disabled = c.out === null; if (c.out === null && where === "out") { $("#bwhere").value = "town"; where = "town"; }
  var p, note;
  if (mode === "self") { p = where === "town" ? c.self : (c.selfOut || "ask"); note = t(where === "town" ? "r3" : "r4"); }
  else { p = where === "town" ? c.town : c.out; note = where === "town" ? t("r1") + " · " + t("r1b") : t("r2") + " · " + t("r2b"); }
  var total = typeof p === "number" ? p * days : null;
  return {car: c, where: where, mode: mode, days: days, unit: p, total: total, note: note};
}
function showQuote() {
  var q = quote();
  if (q.total) {
    $("#esum").textContent = money(q.total);
    $("#enote").textContent = (q.days > 1 ? money(q.unit) + " × " + q.days + " " + t("day") + " · " : "") + q.note;
  } else {
    $("#esum").textContent = t("confirm");
    $("#enote").textContent = q.note + " · " + t("askp");
  }
}

/* ---- modal ---- */
var cur = null;
function row(a, b, v) {
  var val = typeof v === "number" ? "<strong>" + money(v) + "</strong>" : '<strong class="soft">' + v + "</strong>";
  return '<div class="pr"><div><b>' + a + "</b><span>" + b + "</span></div>" + val + "</div>";
}
function setPhoto(n) {
  $("#mimg").src = src(n); $("#mbg").style.backgroundImage = "url(" + src(n) + ")";
  $$("#mth button").forEach(function (b) { b.classList.toggle("on", b.dataset.n === n); });
}
function fillModal() {
  var c = cur; if (!c) return;
  $("#mname").textContent = c.name; $("#mimg").alt = c.name;
  $("#mtag").textContent = t(c.cat); $("#mtag").className = "tag " + c.cat;
  $("#mbad").innerHTML = badges(c);
  var h = row(t("r1"), t("r1b"), c.town);
  h += row(t("r2"), c.out === null ? "" : t("r2b"), c.out === null ? t("townonly") : (c.out === "ask" ? t("askp") : c.out));
  if (c.self) h += row(t("r3"), t("r3b"), c.self);
  if (c.selfOut) h += row(t("r4"), t("r3b"), c.selfOut);
  $("#mpt").innerHTML = h;
  $("#mwa").href = waLink(carMsg(c));
}
function openCar(id) {
  cur = byId(id); if (!cur) return;
  $("#mth").innerHTML = cur.img.map(function (n) { return '<button type="button" data-n="' + n + '"><img src="' + src(n) + '" alt=""></button>'; }).join("");
  fillModal(); setPhoto(cur.img[0]);
  $("#modal").classList.add("open"); $("#modal").setAttribute("aria-hidden", "false"); document.body.classList.add("lock");
  $("#bcar").value = id; showQuote();
}
function closeCar() { $("#modal").classList.remove("open"); $("#modal").setAttribute("aria-hidden", "true"); document.body.classList.remove("lock"); }

/* ---- hero slideshow ---- */
var slide = 0, timer = null;
function buildHero() {
  var f = $("#frame");
  HERO.forEach(function (id, i) {
    var c = byId(id), im = document.createElement("img");
    im.src = src(c.img[0]); im.alt = c.name; if (i) im.loading = "lazy";
    f.insertBefore(im, f.firstChild);
    var d = document.createElement("i"); $("#dots").appendChild(d);
  });
  go(0);
  timer = setInterval(function () { go((slide + 1) % HERO.length); }, 4500);
}
function go(i) {
  slide = i;
  var c = byId(HERO[i]);
  $$("#frame img").forEach(function (im) { im.classList.toggle("on", im.alt === c.name); });
  $$("#dots i").forEach(function (d, k) { d.classList.toggle("on", k === i); });
  $("#capn").textContent = c.name;
  $("#capp").textContent = money(c.town) + " " + t("perday");
}

function countUp(el, to, fmt) {
  var s = null;
  function step(ts) { if (!s) s = ts; var p = Math.min(1, (ts - s) / 1100), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
  setTimeout(function () { el.textContent = fmt(to); }, 1400);
}

function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(function (el) { el.textContent = t(el.dataset.t); });
  $$("[data-th]").forEach(function (el) { el.innerHTML = t(el.dataset.th); });
  $("#lang").textContent = lang === "sw" ? "English" : "Kiswahili";
  var hi = lang === "sw" ? "Habari, nahitaji kukodi gari Dodoma." : "Hello, I need to rent a car in Dodoma.";
  $$("[data-wa]").forEach(function (a) { a.href = waLink(hi); a.target = "_blank"; a.rel = "noopener"; });
  renderChips(); renderCars(); renderSelect(); showQuote(); go(slide); fillModal();
}

var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
  es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, {threshold: 0.1}) : null;
function watch() { $$(".rv:not(.in)").forEach(function (el) { if (io) io.observe(el); else el.classList.add("in"); }); }

$$("[data-call]").forEach(function (a) { a.href = "tel:" + CALL; });
$$("[data-num]").forEach(function (a) { a.textContent = pretty(CALL); });
$("#yr").textContent = new Date().getFullYear();
if (SAMPLE) $("#draft").hidden = false;

var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
$("#bdate").value = d.toISOString().slice(0, 10); $("#bdate").min = $("#bdate").value;

renderSelect(); renderTrack(); buildHero(); applyLang();

var low = Math.min.apply(null, CARS.map(function (c) { return Math.min(c.town, c.self || c.town); }));
countUp($("#st1"), CARS.length, String);
countUp($("#st2"), low, money);

$("#lang").addEventListener("click", function () {
  lang = lang === "sw" ? "en" : "sw";
  try { localStorage.setItem("dcr_lang2", lang); } catch (e) {}
  applyLang();
});
$("#chips").addEventListener("click", function (e) {
  var b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f; renderChips(); renderCars();
});
$$("[data-go]").forEach(function (b) {
  b.addEventListener("click", function () { filter = b.dataset.go; renderChips(); renderCars(); $("#magari").scrollIntoView({behavior: "smooth"}); });
});
$("#grid").addEventListener("click", function (e) {
  if (e.target.closest(".acts")) return;
  var c = e.target.closest(".car-card"); if (c) openCar(c.dataset.id);
});
$("#grid").addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return; var c = e.target.closest(".car-card"); if (c) openCar(c.dataset.id);
});
$("#capgo").addEventListener("click", function () { openCar(HERO[slide]); });
$("#mth").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) setPhoto(b.dataset.n); });
$("#mx").addEventListener("click", closeCar);
$("#modal").addEventListener("click", function (e) { if (e.target === this) closeCar(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCar(); });

["bcar", "bdays", "bwhere", "bdrv"].forEach(function (id) { $("#" + id).addEventListener("input", showQuote); });
$("#book").addEventListener("submit", function (e) {
  e.preventDefault();
  var q = quote(), date = $("#bdate").value.split("-").reverse().join("/");
  var sw = "Habari, naomba kukodi " + q.car.name + " kuanzia tarehe " + date + ", kwa siku " + q.days + ". Safari: " + (q.where === "town" ? "mjini" : "nje ya mji") + ", " + (q.mode === "self" ? "self-drive" : "na dereva") + "." + (q.total ? " Makadirio kwenye website: " + money(q.total) + "." : "") + " Linapatikana?";
  var en = "Hello, I would like to rent the " + q.car.name + " from " + date + " for " + q.days + " day(s). Trip: " + (q.where === "town" ? "in town" : "outside town") + ", " + (q.mode === "self" ? "self-drive" : "with a driver") + "." + (q.total ? " Website estimate: " + money(q.total) + "." : "") + " Is it available?";
  window.open(waLink(lang === "sw" ? sw : en), "_blank", "noopener");
});

var fr = $("#frame");
if (window.matchMedia("(hover:hover)").matches) {
  fr.parentNode.addEventListener("mousemove", function (e) {
    var r = fr.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    fr.style.setProperty("--ry", (x * 7) + "deg"); fr.style.setProperty("--rx", (-y * 6) + "deg");
  });
  fr.parentNode.addEventListener("mouseleave", function () { fr.style.setProperty("--ry", "0deg"); fr.style.setProperty("--rx", "0deg"); });
}
window.addEventListener("scroll", function () {
  var h = document.documentElement, p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  $("#prog").style.width = (p * 100) + "%";
  $("#hd").classList.toggle("on", h.scrollTop > 10);
}, {passive: true});
</script>
</body>
</html>
